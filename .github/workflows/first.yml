name: "first workflow"
on:
  push:
  pull_request:
    branches:
      - main
      - dev
      - qa
jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: set node js in VM
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"

      - name: install dependencies
        run: npm ci

      - name: Run ESLint in app
        run: npm run lint

      - name: Build
        run: npm run build
