name: "first workflow"
on: push
jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: install dependencies
        run: npm install

      - name: Install node js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"

      - name: Build
        run: npm run build
