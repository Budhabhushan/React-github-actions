name: "first workflow"
on:
  push:
  pull_request:
    branches:
      - main
      - dev
      - qa
jobs:
  lint_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: set node js in VM
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"

      - name: install dependencies
        run: npm ci

      - name: Run ESLint in app
        run: npm run lint

  test_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: set node js in VM
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"

      - name: install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build_job:
    needs: [lint_job, test_job]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: set node js in VM
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"

      - name: install dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

  deploy_job:
    needs: [lint_job, test_job, build_job]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install vercel cli
        run: npm install --g vercel

      - name: Deployment on vercel
        run: vercel --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
